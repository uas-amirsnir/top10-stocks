<script>
function initApp(){
  // TAP-TO-EXPLAIN (Amir 2026-08-18: "long-press on a phone not activating the meta text") — title= tooltips
  // are desktop-hover only and do nothing on touch. So a tap on any element carrying a title (column header,
  // score chip, status cell) shows that text in a dismissible bar at the bottom of the screen.
  (function(){
    var tip=document.getElementById('tiptoast');
    if(!tip){
      tip=document.createElement('div'); tip.id='tiptoast';
      tip.style.cssText='display:none;position:fixed;left:8px;right:8px;bottom:8px;background:#16233f;border:1px solid #2a3a5e;'+
        'border-radius:10px;padding:15px 17px;font-size:16px;line-height:1.5;color:#f2f6fc;z-index:60;box-shadow:0 8px 26px rgba(0,0,0,.6)';
      document.body.appendChild(tip);
    }
    var timer=null;
    function hide(){tip.style.display='none';}
    function show(txt){tip.textContent=txt;tip.style.display='block';clearTimeout(timer);timer=setTimeout(hide,9000);}
    document.addEventListener('click',function(ev){
      if(ev.target&&(ev.target.tagName==='INPUT'||ev.target.tagName==='BUTTON'||ev.target.tagName==='A')) return;
      var el=ev.target&&ev.target.closest?ev.target.closest('[title]'):null;
      var txt=el&&el.getAttribute('title');
      if(txt){show(txt);} else {hide();}
    },false);
  })();
  function tint(tr,on){tr.style.background=on?'rgba(34,197,94,.09)':'';}
  function save(t,on){try{localStorage.setItem('t10held_'+t,on?'1':'0');}catch(e){}}
  function sync(){
    var tb=document.getElementById('mytbody'), card=document.getElementById('mycard');
    if(!tb||!card) return;
    tb.innerHTML=''; var n=0;
    document.querySelectorAll('#maintbl input.heldchk').forEach(function(cb){
      if(!cb.checked) return; n++;
      var c=cb.closest('tr').cloneNode(true);
      c.style.display=''; tint(c,true);
      var ccb=c.querySelector('input.heldchk'); ccb.checked=true;
      ccb.addEventListener('change',function(){
        cb.checked=false; save(cb.dataset.t,false); tint(cb.closest('tr'),false); sync();});
      tb.appendChild(c);
    });
    card.style.display=n?'':'none';
  }
  document.querySelectorAll('#maintbl input.heldchk').forEach(function(cb){
    try{cb.checked=localStorage.getItem('t10held_'+cb.dataset.t)==='1';}catch(e){}
    tint(cb.closest('tr'),cb.checked);
    cb.addEventListener('change',function(){save(cb.dataset.t,cb.checked); tint(cb.closest('tr'),cb.checked); sync();});
  });
  document.querySelectorAll('#maintbl tr[data-rank]').forEach(function(tr){
    tr.style.display=parseInt(tr.dataset.rank,10)<=10?'':'none';});
  // "Track a stock you hold" — search the FULL scored universe shipped in this page (incl. names far below
  // the top 10) by ticker or company name; matches get marked held -> appear in My tracked holdings with
  // their live rank & score. Names outside the tracked universe cannot be scored (the scoring runs
  // server-side on a defined universe) — the user gets an honest message instead of a blank row.
  (function(){
    var inp=document.getElementById('addtick'), btn=document.getElementById('addbtn'),
        msg=document.getElementById('addmsg'), dl=document.getElementById('ticklist');
    if(!inp||!btn) return;
    var rows=[];
    document.querySelectorAll('#maintbl tr[data-rank]').forEach(function(tr){
      var cb=tr.querySelector('input.heldchk'); if(!cb) return;
      var nm=(tr.querySelector('.nm')||{}).textContent||'';
      rows.push({t:cb.dataset.t.toUpperCase(), name:nm.trim(), cb:cb});
      if(dl){var o=document.createElement('option'); o.value=cb.dataset.t; o.label=nm.trim(); dl.appendChild(o);}
    });
    function doAdd(){
      var q=(inp.value||'').trim().toUpperCase();
      if(!q){msg.textContent='';return;}
      var hit=rows.find(function(r){return r.t===q;}) ||
              rows.find(function(r){return r.name.toUpperCase().indexOf(q)>=0;});
      if(hit){
        hit.cb.checked=true; save(hit.cb.dataset.t,true); tint(hit.cb.closest('tr'),true); sync();
        msg.textContent='✓ '+hit.name+' added to your tracked list.'; inp.value='';
      }else{
        msg.innerHTML='"'+q+'" is not tracked yet — <a style="color:#7dd3fc" target="_blank" rel="noopener" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=CuYWwp9FskCTHf5RjkAI-2LVeAJsl7BKgJO7Dijx7MlUNExNVjZMNTNaWTJLVDdZR1IwUkRRUUxBNS4u">request it</a> (10-second form) and it will be scored in a future update.';
      }
    }
    btn.addEventListener('click',doAdd);
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')doAdd();});
  })();
  sync();
  try{
    var miss=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
      if(k&&k.indexOf('t10held_')===0&&localStorage.getItem(k)==='1'){
        var t=k.slice(8);
        if(!document.querySelector('#maintbl input.heldchk[data-t="'+t+'"]')) miss.push(t);}}
    var el=document.getElementById('heldmiss');
    if(el&&miss.length) el.textContent='Marked as held but no longer tracked here: '+miss.join(', ');
  }catch(e){}
}
</script>

  var inapp=/WhatsApp|FBAN|FBAV|Instagram|Line\/|Telegram|; wv\)/i.test(ua);
  if(inapp&&/iPhone|iPad|iPod/i.test(ua)) txt='\u26A0\uFE0F You are inside an app\u2019s browser \u2014 to install: tap the menu / share icon and choose \u201COpen in Safari\u201D, then Share \u2192 \u201CAdd to Home Screen\u201D.';
  else if(inapp) txt='\u26A0\uFE0F You are inside an app\u2019s browser \u2014 to install: tap the \u22EE menu and choose \u201COpen in Chrome\u201D, then \u22EE \u2192 \u201CAdd to Home screen\u201D.';
  else if(/iPhone|iPad|iPod/i.test(ua)) txt='\u{1F4F2} Add this to your home screen like an app: tap the Share button \u2934\uFE0F then \u201CAdd to Home Screen\u201D.';
  else if(/Android/i.test(ua)) txt='\u{1F4F2} Add this to your home screen like an app: tap the \u22EE menu, then \u201CAdd to Home screen\u201D (or \u201CInstall app\u201D).';
  else return;
  document.getElementById('insttxt').textContent=txt;
  document.getElementById('instbar').style.display='block';
})();
</script>
<script>
// Age of the data, ticking live (Amir 2026-08-18: show only the time since the last refresh).
var BUILT=1787001360000;
function ageTick(){
  var el=document.getElementById('age'); if(!el) return;
  var s=Math.max(0,(Date.now()-BUILT)/1000), t;
  if(s<90) t='updated just now';
  else if(s<3600) t='updated '+Math.round(s/60)+' min ago';
  else { var m=Math.round(s/60); t='updated '+Math.floor(m/60)+'h '+(m%60)+'m ago'; }
  el.textContent=t;
  el.style.color=(s>3600)?'#fbbf24':'';
}

function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function sha8(s){var h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [].slice.call(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,'0');}).join('').slice(0,8);}
async function unlock(code){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');   // same canonical form as the build side
  if(!code) return false;
  var hint=await sha8(code);
  var ent=PAY.u.filter(function(e){return e.h===hint;})[0];
  if(!ent) return false;
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  var dk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(ent.s),iterations:150000,hash:'SHA-256'},
                                       km,{name:'AES-GCM',length:256},false,['decrypt']);
  var raw;
  try{ raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(ent.i)},dk,b64d(ent.w)); }catch(e){ return false; }
  var info=JSON.parse(new TextDecoder().decode(raw));
  var ck=await crypto.subtle.importKey('raw',b64d(info.k),{name:'AES-GCM'},false,['decrypt']);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(PAY.i)},ck,b64d(PAY.c)));
  document.getElementById('content').innerHTML=html;
  document.getElementById('whoami').textContent=info.n?(info.n+' \u00b7 '):'';
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='';
  ageTick();
  try{localStorage.setItem('t10code',code);}catch(e){}
  initApp(); installBanner();
  return true;
}
(function(){
  if(!(window.crypto&&crypto.subtle)){
    document.getElementById('gerr').textContent='This browser blocks secure unlocking. Open the page over https.';return;}
  var q=new URLSearchParams(location.search).get('u')||location.hash.replace('#','');
  var saved=null; try{saved=localStorage.getItem('t10code');}catch(e){}
  var btn=document.getElementById('gbtn'), inp=document.getElementById('gcode'), err=document.getElementById('gerr');
  async function attempt(c,fromUser){
    err.textContent='';
    try{
      if(await unlock(c)){ try{if(q) history.replaceState({},'',location.pathname);}catch(e2){} return; }
      if(fromUser) err.textContent='That code was not recognised.';
    }catch(e){                                  // surface the real reason (iOS/older browsers) instead of silence
      err.textContent='Unlock error: '+(e&&(e.message||e.name)||e);
    }
  }
  window.addEventListener('error',function(ev){ err.textContent='Script error: '+(ev.message||''); });
  window.addEventListener('unhandledrejection',function(ev){
    err.textContent='Unlock error: '+((ev.reason&&(ev.reason.message||ev.reason.name))||ev.reason||''); });
  btn.addEventListener('click',function(){attempt(inp.value,true);});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')attempt(inp.value,true);});
  if(q) attempt(q,true); else if(saved) attempt(saved,false);
})();
